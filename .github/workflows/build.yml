name: Build Desktop (Win/macOS/Linux)

on:
  push:
    branches: [desktop-electron]
  workflow_dispatch:

# 仅上传每平台的构建产物(Artifact)，不自动发 GitHub Release。
# 如需自动更新生效，请在本仓库手动打 tag / 发 Release（publish 已指向 weng-yiyang/deepseek-harness）。

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 缓存 dsh 运行时（resources/dsh/node_modules）。
      # 命中后 copy-resources.js 的幂等守卫会跳过 npm install @deepseek-ai/dsh，
      # 既规避大依赖树(195 包)解析期的 V8 堆 OOM（macOS runner 默认 2GB 上限），又加速构建。
      - name: Cache dsh runtime
        uses: actions/cache@v4
        with:
          path: resources/dsh/node_modules
          key: dsh-${{ runner.os }}-0.1.1-rc.2

      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm install

      - name: Prepare dsh runtime + bundled node
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run copy-resources

      - name: Build (per OS)
        # mac 不出签名，避免 CI 因缺 Apple 证书而失败；
        # --publish never 关闭 electron-builder 在 CI 下的"隐式发布到 GitHub Releases"
        # （即便 electron-builder.yml 已删 publish 段，CI 探测到 origin 仍会尝试发版，
        #   无 GH_TOKEN 即报错。本决策为"仅上传 Artifact，不发 Release"）。
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run dist -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
