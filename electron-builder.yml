appId: com.wyy.dsh-desktop.portable
productName: DeepSeek Harness 桌面端
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
# 把 dsh 运行时（官方自包含包）、独立 node 运行时、托盘/应用图标塞进安装包
extraResources:
  - from: resources
    to: resources
  - from: build
    to: build
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
mac:
  # mac 包默认不签名（CI 无 Apple 证书）；用户首次打开需在“系统设置-隐私与安全性”放行。
  icon: build/icon.png
  category: public.app-category.developer-tool
  target:
    - dmg
linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
# 自动更新走 GitHub Releases。
# 发布端点指向本仓库（桌面端代码在 desktop-electron 分支，Release 为仓库级），
# 自动更新据此查找更新。
publish:
  - provider: github
    owner: weng-yiyang
    repo: deepseek-harness
