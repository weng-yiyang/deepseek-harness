appId: com.wyy.dsh-desktop.portable
productName: DeepSeek Harness 桌面端
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
# 把 dsh 运行时（官方自包含包）、独立 node 运行时、托盘/应用图标塞进安装包
extraResources:
  - from: resources
    to: resources
  - from: build
    to: build
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
mac:
  # mac 包默认不签名（CI 无 Apple 证书）；用户首次打开需在“系统设置-隐私与安全性”放行。
  icon: build/icon.png
  category: public.app-category.developer-tool
  target:
    - dmg
linux:
  icon: build/icon.png
  category: Development
  # deb 打包要求 maintainer 含 email；syncDesktopName 消除 WM_CLASS 警告
  maintainer: "weng-yiyang <weng-yiyang@users.noreply.github.com>"
  syncDesktopName: true
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
# 自动更新机制（electron-updater，main.js 已 try-catch 容错）保留；
# 但发布动作改为手动：本仓库不发 GitHub Release（仅 CI 上传 Artifact），
# 故移除 publish 配置，避免 CI 隐式触发发布。如需发版，手动 `electron-builder --publish always`。
